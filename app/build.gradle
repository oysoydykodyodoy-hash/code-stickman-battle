plugins {
    id 'com.android.application'
}
android {
    namespace 'app.phonebuilder.codestickmanbattle'
    compileSdk 35
    defaultConfig {
        applicationId 'app.phonebuilder.codestickmanbattle'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs = ['../docs'] } }
}
